<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Inventory Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Inventory Management System</h1>

        <h2>Login</h2>

        {% if error %}

        <p style="
            text-align: center;
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 15px;
        ">
            {{ error }}
        </p>

        {% endif %}

        <form method="POST">

            <label for="username">
                Username:
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password:
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
