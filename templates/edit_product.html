<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Inventory Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Inventory Management System</h1>

        <!-- Navigation -->

        <div class="nav">

            <a href="/dashboard">Dashboard</a>
            <a href="/inventory">Inventory</a>
            <a href="/stock">Stock</a>
            <a href="/suppliers">Suppliers</a>
            <a href="/stock-history">History</a>
            <a href="/reports">Reports</a>
            <a href="/logout">Logout</a>

        </div>

        <h2>Edit Product</h2>

        <!-- Edit Product Form -->

        <form method="POST">

            <label for="name">
                Product Name:
            </label>

            <input
                type="text"
                name="name"
                id="name"
                value="{{ product.name }}"
                required
            >

            <label for="quantity">
                Quantity:
            </label>

            <input
                type="number"
                name="quantity"
                id="quantity"
                value="{{ product.quantity }}"
                min="0"
                required
            >

            <label for="price">
                Price:
            </label>

            <input
                type="number"
                name="price"
                id="price"
                value="{{ product.price }}"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Update Product
            </button>

        </form>

    </div>

</body>

</html>
